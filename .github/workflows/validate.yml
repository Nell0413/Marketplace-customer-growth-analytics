name: Validate analytics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-regressions:
    name: Synthetic regressions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate metrics, input checks and path portability
        run: python -m unittest discover -s tests -v
      - name: Inspect saved PBIX archive and report definitions
        run: python scripts/inspect_pbix.py --output pbix-static-inspection.json
